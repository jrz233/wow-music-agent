name = "wow-music-agent"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# 不需要任何 secret：
# 管理页用 wow-server 账号 OAuth 登录；存储密钥、管理会话、Agent 签名私钥全部
# 在 Durable Object 内自动生成。详见 README「部署」。
#
# 免费版 10ms CPU/请求对扫码轮询与 weapi 加密偏紧，建议 Workers Paid；免费版仍可运行，
# 只是在冷启动时可能更慢。

[observability]
enabled = true

[[durable_objects.bindings]]
name = "AGENT"
class_name = "AgentDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentDurableObject"]

[triggers]
crons = ["*/15 * * * *"]
